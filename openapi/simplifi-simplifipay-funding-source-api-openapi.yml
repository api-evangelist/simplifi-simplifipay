components:
  schemas:
    StatementResponse:
      type: object
      properties:
        companyName:
          type: string
          description: Name of the company.
          examples:
          - SimpliFi
        statementDate:
          type: string
          format: date
          description: The date on which the statement is created.
          examples:
          - '2025-02-28'
        accountId:
          type: string
          description: The account ID of wallet.
          examples:
          - '885180123'
        currency:
          type: string
          description: The currency in which the amounts are transacted.
          examples:
          - USD
        startDate:
          type: string
          format: date-time
          description: The start date of the date range.
          examples:
          - '2025-02-28 13:31:00'
        endDate:
          type: string
          format: date-time
          description: The end date of the date range.
          examples:
          - '2025-02-28 13:31:00'
        openingBalance:
          type: number
          format: decimal
          description: The opening balance on the account from the start date of the date range.
          examples:
          - '6.95'
        closingBalance:
          type: number
          format: decimal
          description: The closing balance on the account till the end date of the date range.
          examples:
          - '6.95'
        transactions:
          type: array
          description: The array of transactions.
          items:
            $ref: '#/components/schemas/StatementResponseDetails'
      required:
      - companyName
      - statementDate
      - accountId
      - currency
      - startDate
      - endDate
      - openingBalance
      - closingBalance
      - transactions
    RaiseFundingResponseModel:
      type: object
      properties:
        cardProgramUuid:
          type: string
          description: 'This field contains the system generated unique identifier for the program

            that was created using the Create Card Program API.'
          examples:
          - c83d26ed-f093-4e43-b81b-35884f068d4b
        amount:
          type: number
          format: decimal
          description: This field contains the amount that has been requested for fund transfer.
          examples:
          - '10000.00'
        transactionType:
          type: string
          description: This field contains the type of the transaction either `CREDIT` or `DEBIT`.
          enum:
          - CREDIT
          - DEBIT
          examples:
          - CREDIT
        status:
          type: string
          description: This field contains the status of the Raise Funding
          enum:
          - PENDING
          - ACKNOWLEDGED
          - APPROVED
          - NOT_APPROVED
          - REJECTED
          examples:
          - PENDING
      required:
      - cardProgramUuid
      - amount
      - transactionType
      - status
    RuleGroupModel:
      type: object
      properties:
        uuid:
          type: string
          description: 'This field contains the system generated unique identifier for the rule group

            that was created using the Rule Group API.'
          examples:
          - cceec464-eb26-4fbf-8e91-695f133ced0a
        name:
          type: string
          description: Name of the rule group
          examples:
          - Rule Group 1
        description:
          type: string
          description: Description of the rule group
          examples:
          - Rule Group 1 Description
        transactionRestrictions:
          $ref: '#/components/schemas/RuleGroupTransactionRestrictions'
        loadRestrictions:
          $ref: '#/components/schemas/RuleGroupLoadRestrictions'
        spendRestrictions:
          $ref: '#/components/schemas/RuleGroupSpendRestrictions'
      required:
      - name
    TransactionIdParameter:
      type: string
      description: This is an identifier of the transaction.
      examples:
      - '6712309'
    ErrorModel:
      type: object
      properties:
        errorCode:
          type: integer
          description: A 5-7 digit number defining the error
          examples:
          - '99997'
        message:
          type: string
          description: A brief message defining the error
          examples:
          - General Error
    RuleGroupResponseModel:
      type: object
      properties:
        ruleGroup:
          $ref: '#/components/schemas/RuleGroupModel'
        enabled:
          type: boolean
          description: This field tells whether the `ruleGroup` is enabled or not
          examples:
          - 'true'
      required:
      - ruleGroup
      - enabled
    RuleGroupTransactionRestrictions:
      type: object
      description: Details of transaction-related restrictions.
      properties:
        merchantRules:
          $ref: '#/components/schemas/RuleGroupMerchantRules'
      required:
      - merchantRules
    RuleGroupMerchantRules:
      type: object
      description: Allow or deny merchant category codes.
      properties:
        allow:
          type: boolean
          examples:
          - 'true'
        mcc:
          type: array
          items:
            type: string
        mccException:
          type: array
          items:
            type: string
      required:
      - allow
      - mcc
    RuleGroupSpendRestrictions:
      type: object
      description: Details of card spend-related restrictions.
      properties:
        setLimitPerTxn:
          type: number
          format: decimal
          examples:
          - 123.45
        velocityDailyLimit:
          type: number
          format: decimal
          examples:
          - 3.45
        velocityWeeklyLimit:
          type: number
          format: decimal
          examples:
          - 23.45
        velocityMonthlyLimit:
          type: number
          format: decimal
          examples:
          - 123.45
        txnCountDaily:
          type: number
          format: int32
          examples:
          - 3
        txnCountWeekly:
          type: number
          format: int32
          examples:
          - 5
        txnCountMonthly:
          type: number
          format: int32
          examples:
          - 10
    FundingSourceRequestModel:
      type: object
      properties:
        fundingSource:
          type: string
          description: 'This field contains a token that identifies the funding source that is to be linked with

            the card program. This information will be shared separately. If you don’t have them

            already, click on [this link](https://simplifipay.com/).'
          examples:
          - '1234567'
      required:
      - fundingSource
    RaiseFundingRequestModel:
      type: object
      properties:
        cardProgramUuid:
          type: string
          description: 'This field contains the system generated unique identifier for the program

            that was created using the Create Card Program API.'
          examples:
          - c83d26ed-f093-4e43-b81b-35884f068d4b
        amount:
          type: number
          format: decimal
          description: This field contains the amount that has been requested for fund transfer.
          examples:
          - '10000.00'
        transactionType:
          type: string
          description: This field contains the type of the transaction either `CREDIT` or `DEBIT`.
          enum:
          - CREDIT
          - DEBIT
          examples:
          - CREDIT
        documentUploadUuid:
          type: string
          description: 'This field contains the system generated unique identifier for the document

            that was uploaded'
          examples:
          - e95a7a97-5889-4001-8c40-ed79a8ab6ae9
      required:
      - cardProgramUuid
      - amount
      - transactionType
      - documentUploadUuid
    StatementResponseDetails:
      type: object
      properties:
        fundRequestUuid:
          type: string
          description: This is a unique identifier of the fund request.
          examples:
          - 11e082c2-993d-4026-82c4-1234ec464796
        transactionId:
          $ref: '#/components/schemas/TransactionIdParameter'
        transactionDate:
          type: string
          format: date-time
          description: The date on which the transaction was carried out.
          examples:
          - '2025-02-28 13:31:00'
        amount:
          type: number
          format: decimal
          description: The fund amount.
          examples:
          - '6.95'
        fundRequestType:
          type: string
          description: The type for fund request.
          enum:
          - LOAD
          - UNLOAD
          examples:
          - LOAD
        fundRequestCategory:
          type: string
          description: The category for fund request.
          enum:
          - RAISE_FUNDING
          - FUND_TRANSFER
          - CARD_LOAD
          - CARD_UNLOAD
          examples:
          - RAISE_FUNDING
        previousBalance:
          type: number
          format: decimal
          description: The balance on the account before this transaction.
          examples:
          - '6.95'
        currentBalance:
          type: number
          format: decimal
          description: The current balance on the account.
          examples:
          - '6.95'
        maskPan:
          type: string
          description: The mask pan of the transaction.
          examples:
          - '************2737'
        userName:
          type: string
          description: The username of the user of this transaction.
          examples:
          - john.smith@simplifipay.com
        userFullName:
          type: string
          description: The full name of the user of this transaction.
          examples:
          - John Smith
        userUuid:
          type: string
          description: The UUID of the user of this transaction.
          examples:
          - 1b2dbfc7-3432-4eb8-9367-fb123dcf2ba0
        srcCurrency:
          type: string
          description: Source currency
          examples:
          - USD
        destCurrency:
          type: string
          description: Destination currency
          examples:
          - USD
      required:
      - fundRequestUuid
      - transactionId
      - transactionDate
      - amount
      - fundRequestCategory
      - previousBalance
      - currentBalance
    FundingSourceResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier for the funding source that was created.
          examples:
          - 84caba0c-275a-474c-b6f6-567a6a76b636
        cardProgramUuid:
          type: string
          description: 'This field contains the system generated unique identifier for the program

            that was created using the Create Card Program API.'
          examples:
          - e283c96c-01e6-4afb-9b38-b4d2622e0a57
        fundingSource:
          type: string
          description: This field contains a token that identifies the funding source that is to be linked with the card program.
          examples:
          - '1234567'
        currency:
          type: string
          description: Currency of card program.
          examples:
          - USD
      required:
      - uuid
      - cardProgramUuid
      - fundingSource
      - currency
    FundingSourceBalanceModel:
      type: object
