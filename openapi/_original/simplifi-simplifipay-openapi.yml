components:
  schemas:
    AuthResponseModel:
      type: object
      properties:
        access_token:
          type: string
          description: 'This is the system-generated access token to be used for subsequent calls of the

            same session. It is to be sent as an authorization header along with the

            system-generated token type.'
        expires_in:
          type: string
          description: 'This is the expiry date/time that defines the validity of the access token.

            Note (one needs to re-login before this expiration time).'
        token_type:
          type: string
          description: 'This field contains the token type which is coupled with access token to form

            an authorization header. Accepted value is `bearer`.'
      required:
      - access_token
    CardProgramRequestModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier for the card program that was created
            by this endpoint.
          examples:
          - 68de4d4a-20ed-48c6-8594-dc74e1730cb7
        name:
          type: string
          description: 'This is a custom name for the card program. We recommend choosing a unique name
            to identify the

            card programs that are created under your company.'
          examples:
          - Marketing Budget
        cardProgramTemplateUuid:
          type: string
          description: 'This is a unique identifier that represents a specific card program template.
            A Card Program

            Template contains all the features applicable on a card that would be issued under a card
            program.

            This information is shared by SimpliFi separately. If you don’t have them already, click

            on [this link](https://simplifipay.com/).'
          examples:
          - 36fad307-416e-4333-920a-b07fba57a658
        feesOperationEnabled:
          type: boolean
          default: false
          description: This field checks if fee operation is enabled or not.
          examples:
          - 'true'
        config:
          $ref: '#/components/schemas/CardConfigModel'
      required:
      - name
      - cardProgramTemplateUuid
    CardConfigModel:
      type: object
      description: 'This object is a collection of configuration fields including both Point of Interest
        and Velocity

        Control fields. It contains sub-fields explained in the rows below.'
      properties:
        poi:
          $ref: '#/components/schemas/CardPoi'
      required:
      - poi
    CardPoi:
      type: object
      description: 'This object is a collection of Point of Interest configuration fields showing where
        the card

        issued under this card program can be used. It contains sub-fields explained in the rows below.'
      properties:
        ecommerce:
          type: boolean
          description: 'This field, if enabled, allows online transactions.

            The allowed values are `true` and `false`.'
          examples:
          - 'true'
        atm:
          type: boolean
          description: 'This field, if enabled, allows Automated Teller Machine (ATM) transactions.

            The allowed values are `true` and `false`.'
