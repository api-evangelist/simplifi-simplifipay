    fees, rule groups, and webhook management. SimpliFi uses an asynchronous architecture: API calls return
    2xx on receipt and final outcomes are delivered via webhooks.'
  contact:
    name: SimpliFi Support
    email: info@simplifipay.com
    url: https://apidoc.simplifipay.com/
