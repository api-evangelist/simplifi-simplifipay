name: Simplifi/Simplifipay
description: SimpliFi (simplifipay.com) is a Cards-as-a-Service platform powering virtual and physical
  card programs for fintechs, startups, and enterprises across the GCC (UAE, Saudi Arabia, Kuwait, Bahrain,
  Oman, Qatar). Regulated by the Dubai Financial Services Authority (DFSA), SimpliFi offers off-the-shelf
  and fully customizable card programs with multi-currency support (50+ currencies), digital-wallet enablement
  (Apple/Google/Samsung Pay), programmable authorization, velocity, and merchant controls, and real-time
  transaction and fraud monitoring. Its developer platform exposes a JWT-authenticated REST API (card
  programs, funding sources, cards, users, transactions, fees, rule groups, and webhook management) on
  an asynchronous, webhook-driven architecture, plus a PCI-DSS-compliant Virtual Card SDK for securely
  displaying card data. Surfaced as a 500 Global portfolio company and enriched by the API Evangelist
  pipeline.
